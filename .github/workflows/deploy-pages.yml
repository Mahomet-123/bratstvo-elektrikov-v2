# Деплой PWA «Братство Электриков v2» на GitHub Pages.
# Публикуется содержимое каталога public/ — статика без сборки.
name: Деплой сайта на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права, необходимые для публикации на Pages через OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Не запускаем два деплоя одновременно.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Проверка синтаксиса модулей
        run: node scripts/check-syntax.js

      - name: Подготовка GitHub Pages
        uses: actions/configure-pages@v5

      - name: Сборка статики из public/
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Публикация на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
